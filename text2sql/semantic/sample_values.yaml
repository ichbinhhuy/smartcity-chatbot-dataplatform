# Mapping giá trị hiển thị <-> giá trị thật trong DB cho các dimension dạng enum.
#
# Cube Meta API chỉ trả về TÊN field, không trả về giá trị thật đang có trong
# data warehouse — đây là phần bù cho thứ Cube không cung cấp, xem
# docs/02-cube-architecture.md mục 3 ("Vai trò riêng của sample_values.yaml").
#
# Key: đúng theo Cube member format "cube.dimension". Value: danh sách giá trị
# thật trong DB, dùng để fuzzy-match giá trị LLM tự viết ra (vd "Quận 1" -> ...).
#
# Dimension có giá trị lấy trực tiếp từ DB (vd district_name — hàng trăm quận,
# không liệt kê hết được) thì không khai báo ở đây; validator bỏ qua fuzzy-match
# cho những field không có mặt trong file này.

energy.region: [noi_thanh, ngoai_thanh]
energy.sector: [residential, industrial, commercial, public]

traffic.region: [noi_thanh, ngoai_thanh]
traffic.congestion_level: [low, medium, high]

air_quality.region: [noi_thanh, ngoai_thanh]
air_quality.sensor_type: [air_quality]

public_transport.transport_mode: [bus, metro, brt]
