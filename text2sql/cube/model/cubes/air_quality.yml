# Cube "air_quality" — chất lượng không khí đo bằng sensor môi trường.
cubes:
  - name: air_quality
    sql_table: public.fact_air_quality_readings

    joins:
      - name: district
        sql: "{CUBE}.district_id = {district.district_id}"
        relationship: many_to_one
      - name: sensor
        sql: "{CUBE}.sensor_id = {sensor.sensor_id}"
        relationship: many_to_one

    measures:
      - name: avg_aqi
        sql: aqi
        type: avg
        title: "Chỉ số AQI trung bình"
        description: "Chỉ số chất lượng không khí AQI trung bình"

      - name: max_aqi
        sql: aqi
        type: max
        title: "Chỉ số AQI cao nhất"
        description: "Chỉ số AQI cao nhất ghi nhận được"

      - name: avg_pm25
        sql: pm25
        type: avg
        title: "Nồng độ PM2.5 trung bình"
        description: "Nồng độ bụi mịn PM2.5 trung bình (µg/m3)"

      - name: unhealthy_ratio
        sql: "CASE WHEN {CUBE}.aqi > 100 THEN 1.0 ELSE 0.0 END"
        type: avg
        title: "Tỷ lệ AQI vượt ngưỡng an toàn"
        description: "Tỷ lệ bản ghi có AQI vượt ngưỡng an toàn (AQI > 100)"

    dimensions:
      - name: reading_id
        sql: reading_id
        type: number
        primary_key: true
        public: false # khoá kỹ thuật, không hữu ích để LLM group/filter theo

      - name: district_name
        sql: "{district.district_name}"
        type: string
        description: "Tên quận/huyện"

      - name: region
        sql: "{district.region}"
        type: string
        description: "Khu vực nội thành/ngoại thành"

      - name: sensor_type
        sql: "{sensor.sensor_type}"
        type: string
        description: "Loại thiết bị đo"

      - name: recorded_at
        sql: recorded_at
        type: time
        description: "Thời điểm đo chất lượng không khí"
