# Cube "energy" — tiêu thụ điện năng trên địa bàn thành phố.
# Chuyển thể trực tiếp từ cube `energy` trong semantic/smart_city.yaml cũ; đây
# là nguồn sự thật mới cho measures/dimensions/joins, xem
# docs/02-cube-architecture.md mục 3.
cubes:
  - name: energy
    sql_table: public.fact_energy_consumption

    joins:
      - name: district
        sql: "{CUBE}.district_id = {district.district_id}"
        relationship: many_to_one

    measures:
      - name: total_consumption
        sql: kwh
        type: sum
        title: "Tổng lượng điện tiêu thụ"
        description: "Tổng lượng điện tiêu thụ (kWh)"

      - name: avg_consumption
        sql: kwh
        type: avg
        title: "Lượng điện tiêu thụ trung bình"
        description: "Lượng điện tiêu thụ trung bình mỗi bản ghi (kWh)"

      - name: peak_consumption
        sql: kwh
        type: max
        title: "Mức tiêu thụ điện cao nhất"
        description: "Mức tiêu thụ điện cao nhất ghi nhận được (kWh)"

      - name: reading_count
        type: count
        title: "Số bản ghi tiêu thụ điện"

    dimensions:
      - name: reading_id
        sql: reading_id
        type: number
        primary_key: true
        public: false # khoá kỹ thuật, không hữu ích để LLM group/filter theo

      - name: district_name
        sql: "{district.district_name}"
        type: string
        description: "Tên quận/huyện"

      - name: region
        sql: "{district.region}"
        type: string
        description: "Khu vực nội thành/ngoại thành"

      - name: sector
        sql: sector
        type: string
        description: "Ngành tiêu thụ điện: residential / industrial / commercial / public"

      - name: recorded_at
        sql: recorded_at
        type: time
        description: "Thời điểm ghi nhận chỉ số điện"
