# Chạy Cube Core self-host — miễn phí, Apache-2.0, không qua Cube Cloud.
# Xem docs/02-cube-architecture.md mục 1.
#
#   cd cube && docker compose up
#
# Meta API:  GET  http://localhost:4000/cubejs-api/v1/meta
# Query API: POST http://localhost:4000/cubejs-api/v1/load
# Playground (dev mode): http://localhost:4000
version: "3.9"

services:
  cube:
    image: cubejs/cube:latest
    ports:
      - "4000:4000" # REST/GraphQL/SQL API + Playground
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-dev-secret-change-me}
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: ${CUBEJS_DB_HOST:-host.docker.internal}
      CUBEJS_DB_PORT: ${CUBEJS_DB_PORT:-5432}
      CUBEJS_DB_NAME: ${CUBEJS_DB_NAME:-smart_city}
      CUBEJS_DB_USER: ${CUBEJS_DB_USER:-postgres}
      CUBEJS_DB_PASS: ${CUBEJS_DB_PASS:-postgres}
    volumes:
      - ./model:/cube/conf/model
