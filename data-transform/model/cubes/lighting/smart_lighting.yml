cubes:
  - name: smart_lighting
    sql: "SELECT * FROM starrocks_gold.fact_lighting WHERE is_valid = true"

    joins:
      - name: districts
        sql: "{CUBE}.section_id = {districts.id}"
        relationship: belongsTo

    measures:
      - name: total_power_kwh
        sql: power_kwh
        type: sum

      - name: avg_power_per_pole
        sql: power_kwh
        type: avg

      - name: sum_power_per_pole
        sql: power_kwh
        type: sum

      - name: faulty_lamp_count
        sql: "CASE WHEN status = 'FAULTY' THEN 1 ELSE 0 END"
        type: sum

      - name: faulty_lamp_pct
        sql: "CASE WHEN status = 'FAULTY' THEN 100.0 ELSE 0.0 END"
        type: avg

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true

      - name: section_id
        sql: section_id
        type: string

      - name: pole_id
        sql: pole_id
        type: string

      - name: lamp_status
        sql: status
        type: string

      - name: operating_mode
        sql: |
          CASE 
            WHEN HOUR(recorded_at) BETWEEN 18 AND 23 THEN 'EVENING_FULL'
            WHEN HOUR(recorded_at) BETWEEN 1 AND 5 THEN 'NIGHT_DIMMING'
            ELSE 'DAY_OFF'
          END
        type: string

      - name: recorded_at
        sql: recorded_at
        type: time

    pre_aggregations:
      - name: daily_lighting_by_district
        measures:
          - smart_lighting.total_power_kwh
          - smart_lighting.faulty_lamp_count
        dimensions:
          - districts.name
        time_dimension: smart_lighting.recorded_at
        granularity: day
