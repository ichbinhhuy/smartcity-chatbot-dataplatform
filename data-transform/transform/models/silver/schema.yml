version: 2

models:
  - name: silver_traffic
    description: >
      Traffic data cleansed from bronze_traffic.
      Deduped by event_id, datetime parsed, DQ flags and full audit metadata applied.
    columns:
      - name: id
        description: "Primary key (= event_id từ Bronze)"
        tests:
          - unique
          - not_null
      - name: recorded_at
        tests:
          - not_null
      - name: vehicle_count
        tests:
          - not_null
      - name: avg_speed_kmh
        tests:
          - not_null
      - name: record_status
        tests:
          - not_null
          - accepted_values:
              values: ['VALID', 'INVALID', 'WARNING']
      - name: primary_dq_flag
        tests:
          - not_null

  - name: silver_parking
    description: >
      Parking data cleansed from bronze_parking.
      Deduped, raw values kept, overflow clamped clean value derived, DQ flags and full audit metadata applied.
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: recorded_at
        tests:
          - not_null
      - name: occupied_slots_raw
        tests:
          - not_null
      - name: occupied_slots_clean
        tests:
          - not_null
      - name: record_status
        tests:
          - not_null
          - accepted_values:
              values: ['VALID', 'INVALID', 'WARNING']
      - name: primary_dq_flag
        tests:
          - not_null

  - name: silver_environment
    description: >
      Environment sensor data cleansed from bronze_environment.
      Deduped, raw AQI kept for audit, negative AQI flagged for Gold filtering, DQ flags and full audit metadata applied.
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: timestamp
        tests:
          - not_null
      - name: record_status
        tests:
          - not_null
          - accepted_values:
              values: ['VALID', 'INVALID', 'WARNING']
      - name: primary_dq_flag
        tests:
          - not_null

  - name: silver_lighting
    description: >
      Lighting (SCADA/XML) data cleansed from bronze_lighting.
      Deduped, NULL power_kwh safe-coalesced to 0.0 for DDL NOT NULL, flagged as INVALID, DQ flags and full audit metadata applied.
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: recorded_at
        tests:
          - not_null
      - name: power_kwh
        tests:
          - not_null
      - name: record_status
        tests:
          - not_null
          - accepted_values:
              values: ['VALID', 'INVALID', 'WARNING']
      - name: primary_dq_flag
        tests:
          - not_null

  - name: silver_incident
    description: >
      Incident report data cleansed from bronze_incident.
      Deduped, timestamp_end derived from timestamp_start + duration_min, DQ flags and full audit metadata applied.
    columns:
      - name: incident_id
        tests:
          - unique
          - not_null
      - name: timestamp_start
        tests:
          - not_null
      - name: timestamp_end
        tests:
          - not_null
      - name: duration_min
        tests:
          - not_null
      - name: record_status
        tests:
          - not_null
          - accepted_values:
              values: ['VALID', 'INVALID', 'WARNING']
      - name: primary_dq_flag
        tests:
          - not_null
