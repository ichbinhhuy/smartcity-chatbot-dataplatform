# Bảng dimension "tuyến giao thông công cộng" — dùng để join từ public_transport.
# public: false -> không lộ ra Cube Meta API, chỉ dùng nội bộ cho join.
cubes:
  - name: transport_route
    sql_table: public.dim_transport_route
    public: false

    dimensions:
      - name: route_id
        sql: route_id
        type: number
        primary_key: true

      - name: route_name
        sql: route_name
        type: string

      - name: transport_mode
        sql: transport_mode
        type: string
        description: "bus / metro / brt"
